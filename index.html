<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3b2a20">
<meta name="mobile-web-app-capable" content="yes">
<title>咖啡機遙控</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f1ea; --card: #fffdf9; --ink: #2b211b; --muted: #7a6a5e; --line: #e7ddd1;
    --brand: #6b4226; --brand-ink: #fff; --ok: #2f7d4f; --warn: #b7791f; --bad: #c0392b;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 520px; margin: 0 auto; padding: 16px 14px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin: 6px 4px 14px; }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  header .cup { font-size: 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(60,40,20,.05); }
  .card h2 { font-size: 17px; margin: 0 0 12px; color: var(--brand); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .label { font-size: 17px; }
  .label small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; font-size: 24px; color: var(--brand); }
  .stepper button:active { background: #f1e7dc; }
  .stepper output { min-width: 74px; text-align: center; font-size: 22px; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--brand); height: 32px; }
  .total { text-align: center; padding: 10px 0 4px; }
  .total b { font-size: 40px; color: var(--brand); }
  .total span { color: var(--muted); }
  .plan { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.6; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { flex: 1; padding: 10px 12px; font-size: 15px; white-space: nowrap; border: 0; background: #fff; color: var(--ink); }
  .seg button.on { background: var(--brand); color: var(--brand-ink); }
  .big { width: 100%; font-size: 21px; font-weight: 700; padding: 18px; border-radius: 16px;
    border: 0; background: var(--brand); color: var(--brand-ink); }
  .big:disabled { background: #cfc3b6; color: #fff; }
  .big.secondary { background: #fff; color: var(--brand); border: 2px solid var(--brand); }
  .big.stop { background: var(--bad); font-size: 24px; padding: 22px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pill { padding: 6px 12px; border-radius: 999px; background: #efe6dc; font-size: 14px; }
  .pill.ok { background: #e3f1e8; color: var(--ok); }
  .pill.warn { background: #fbf0dc; color: var(--warn); }
  .pill.bad { background: #f8e1de; color: var(--bad); }
  .checks label { display: flex; gap: 12px; align-items: center; padding: 12px 2px; font-size: 17px;
    border-top: 1px solid var(--line); }
  .checks label:first-child { border-top: 0; }
  .checks input { width: 26px; height: 26px; accent-color: var(--brand); flex: none; }
  .alert { border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; font-size: 16px; line-height: 1.55; }
  .alert.bad { background: #fbe9e6; border: 1px solid #f0c4bd; color: #7d241a; }
  .alert.warn { background: #fdf4e3; border: 1px solid #f1dbb0; color: #6e4a0e; }
  .alert.ok { background: #e7f4ec; border: 1px solid #bfe0cb; color: #1f5636; }
  .phase { font-size: 30px; font-weight: 800; text-align: center; margin: 6px 0 4px; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 12px; }
  .bar { height: 16px; background: #efe6dc; border-radius: 999px; overflow: hidden; margin: 8px 0 12px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #8a5a36, #6b4226); transition: width .4s; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 14px; }
  .nums div { background: #f6efe7; border-radius: 12px; padding: 8px 4px; }
  .nums b { display: block; font-size: 22px; }
  .nums span { font-size: 12px; color: var(--muted); }
  .btnrow { display: flex; gap: 10px; margin-bottom: 10px; }
  .btnrow .big { flex: 1; }
  .hidden { display: none !important; }
  details { margin-top: 8px; }
  summary { color: var(--muted); font-size: 14px; padding: 6px 2px; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: #f3ece4;
    padding: 10px; border-radius: 10px; max-height: 260px; overflow: auto; }
  .foot { color: var(--muted); font-size: 13px; line-height: 1.6; padding: 4px 6px; }
  .linkbtn { background: none; border: 0; color: var(--brand); font-size: 15px; text-decoration: underline; padding: 6px 0; }
</style>
</head>
<body>
<main>
  <header><span class="cup">☕</span><h1>咖啡機遙控</h1></header>

  <div id="msg" class="alert hidden"></div>

  <section class="card" id="connCard">
    <div class="pills">
      <span class="pill" id="pConn">未連線</span>
      <span class="pill hidden" id="pWater"></span>
      <span class="pill hidden" id="pState"></span>
    </div>
    <button class="big" id="btnConnect">連線咖啡機</button>
  </section>

  <section class="card" id="recipeCard">
    <h2>我的配方</h2>
    <div class="row">
      <div class="label">豆量<small>一瓢半約 15 克</small></div>
      <div class="stepper"><button data-k="dose" data-d="-1">−</button><output id="oDose"></output><button data-k="dose" data-d="1">＋</button></div>
    </div>
    <div class="row" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="label">濃淡<small>往右＝水更多、更淡</small></div>
        <div style="font-size:20px;font-weight:600" id="oRatio"></div>
      </div>
      <input type="range" id="rRatio" min="14" max="25" step="0.5">
      <div class="total"><b id="oTotal"></b> <span>ml 黑咖啡</span></div>
      <div class="plan" id="oPlan"></div>
    </div>
    <div class="row">
      <div class="label">水溫</div>
      <div class="stepper"><button data-k="temp" data-d="-1">−</button><output id="oTemp"></output><button data-k="temp" data-d="1">＋</button></div>
    </div>
    <div class="row">
      <div class="label">研磨度<small>數字越大越粗</small></div>
      <div class="stepper"><button data-k="grind" data-d="-1">−</button><output id="oGrind"></output><button data-k="grind" data-d="1">＋</button></div>
    </div>
    <div class="row">
      <div class="label">濾杯</div>
      <div class="seg" id="segCup"><button data-cup="2">Omni 濾杯</button><button data-cup="3">其他濾杯</button></div>
    </div>
    <button class="linkbtn" id="btnReset">恢復預設（15 克、最大水量）</button>
  </section>

  <section class="card" id="checkCard">
    <h2>開始前確認</h2>
    <div class="checks">
      <label><input type="checkbox" class="chk"> <span id="cBeans">豆子已倒進上方豆倉</span></label>
      <label><input type="checkbox" class="chk"> 濾杯和濾紙已放好</label>
      <label><input type="checkbox" class="chk"> <span id="cPot">下面放了夠大的壺</span></label>
    </div>
    <button class="big" id="btnBrew" disabled style="margin-top:10px">開始沖煮</button>
  </section>

  <section class="card hidden" id="brewCard">
    <div class="phase" id="oPhase">準備中…</div>
    <div class="sub" id="oSub">請留在咖啡機旁邊</div>
    <div class="bar"><div id="oBar"></div></div>
    <div class="nums">
      <div><b id="nWater">0</b><span>已注水 ml</span></div>
      <div><b id="nWeight">–</b><span>重量 g</span></div>
      <div><b id="nTime">0:00</b><span>經過時間</span></div>
    </div>
    <div class="btnrow">
      <button class="big secondary" id="btnPause">暫停</button>
      <button class="big secondary hidden" id="btnResume">繼續</button>
    </div>
    <button class="big stop" id="btnStop">停止</button>
    <button class="big secondary hidden" id="btnAgain" style="margin-top:10px">回到配方</button>
  </section>

  <div class="foot">
    咖啡機面板目前故障，旋鈕不能用，請用這個頁面操作。<br>
    請不要拔咖啡機的插頭；如果斷過電，要先用官方 xBloom App 做一次「重設磨豆刀盤」才能沖。<br>
    沖煮時請把手機放在咖啡機旁、螢幕保持開著。
  </div>

  <details>
    <summary>技術紀錄</summary>
    <button class="linkbtn" id="btnDry">檢查配方能否送出（不沖煮）</button>
    <pre id="log"></pre>
  </details>
</main>

<script>
// xBloom Studio BLE protocol (ported from the MIT-licensed community library
// xbloom-py by Alshekhi; frame format, recipe blob and firmware gate logic).
// Works in the browser (window.XB) and in Node (module.exports) for testing.
(function (root) {
  'use strict';
  const XB = {};
  const f32 = Math.fround;

  XB.SVC = '0000e0ff-3c17-d293-8e48-14fe2e4da212';
  XB.FFE1 = '0000ffe1-0000-1000-8000-00805f9b34fb';
  XB.FFE2 = '0000ffe2-0000-1000-8000-00805f9b34fb';

  XB.CMD = {
    HANDSHAKE: 8100, BYPASS_DOSE: 8102, SET_CUP: 8104,
    RECIPE_GRIND: 8001, RECIPE_NO_GRIND: 8004, EXECUTE: 8002,
    QUIT_RECIPE: 8017, BREW_PAUSE: 40518, BREW_RESUME: 40524, BREW_STOP: 40519,
  };
  XB.NOTIFY = {
    ACTIVITY: 8023, WEIGHT: 20501, WEIGHT_ALT: 10507, WATER: 40523,
    BLOOM: 40510, ENJOY: 40512, ENJOY_PRE: 40511, ABANDONED: 40513,
    MACHINE_INFO: 40521, GRINDER_STOPPED: 40507,
    PAUSED: 40515, RESUMED: 40516, GRINDER_PAUSED: 9009, BREWER_PAUSED: 9010,
    MACHINE_RESUMED: 9011, SLEEPING: 8009, AWAKE: 8011,
  };
  XB.FAULTS = {
    40522: '水箱沒水',
    40517: '豆倉沒有豆子（或豆子卡住）',
    8204: '粉量或水量異常',
    8203: '磨豆刀盤位置異常',
  };
  // Cup api id -> [theMax, theMin] weight-range values the app sends (8104).
  XB.CUP_RANGE = { 1: [200, 80], 2: [110, 90], 3: [200, 80], 4: [200, 80] };
  XB.CUP_DOSE = { 2: [5, 18], 3: [5, 25] };

  // Refusal bits, read in this order (spec.REFUSAL_BITS).
  XB.REFUSALS = [
    [0x000040, 'no_water'], [0x000800, 'not_on_home_screen'],
    [0x001000, 'not_on_home_screen'], [0x100000, 'not_ready'],
    [0x200000, 'restore_incomplete'], [0x400000, 'recipe_rejected'],
    ...[0x000100, 0x000200, 0x000400, 0x004000, 0x010000, 0x020000,
      0x040000, 0x080000, 0x800000].map(b => [b, 'machine_busy']),
  ];
  XB.RESEND_MEANS_TAKEN = [0x800000, 0x200000];
  XB.refusalFor = code => {
    for (const [bit, reason] of XB.REFUSALS) if (code & bit) return reason;
    return null;
  };
  XB.takenOnResend = code => !!code && XB.RESEND_MEANS_TAKEN.some(b => code & b);

  // Python's round(): half to even.
  XB.pyRound = x => {
    const f = Math.floor(x), d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  };

  XB.crc16 = bytes => { // CRC-16/KERMIT
    let c = 0;
    for (const b of bytes) {
      c ^= b;
      for (let i = 0; i < 8; i++) c = (c & 1) ? ((c >>> 1) ^ 0x8408) : (c >>> 1);
    }
    return c & 0xffff;
  };

  XB.f32bits = v => {
    const dv = new DataView(new ArrayBuffer(4));
    dv.setFloat32(0, v, true);
    return dv.getUint32(0, true);
  };

  // 58 01 <type> [code LE16] [total_len LE32] 01 [data] [crc LE16]
  XB.frame = (code, opts = {}) => {
    const type = opts.type || 1;
    let body = [];
    if (opts.raw) body = Array.from(opts.raw);
    else if (opts.ints) for (const n of opts.ints) {
      const u = n >>> 0;
      body.push(u & 0xff, (u >>> 8) & 0xff, (u >>> 16) & 0xff, (u >>> 24) & 0xff);
    }
    const len = 12 + body.length;
    const head = [0x58, 0x01, type & 0xff, code & 0xff, (code >>> 8) & 0xff,
      len & 0xff, (len >>> 8) & 0xff, (len >>> 16) & 0xff, (len >>> 24) & 0xff, 0x01];
    const pre = head.concat(body);
    const c = XB.crc16(pre);
    return Uint8Array.from(pre.concat([c & 0xff, (c >>> 8) & 0xff]));
  };

  // Firmware gate: trunc(f32(f32(ratio_byte/10) * dose)) must equal sum(volumes).
  XB.gateVolumes = (srcVols, doseI) => {
    const total = srcVols.reduce((a, b) => a + b, 0);
    if (doseI <= 0 || total <= 0 || !srcVols.length)
      return { vols: srcVols.map(v => XB.pyRound(v)), ratio: 0 };
    const r0 = XB.pyRound((total / doseI) * 10);
    let chosen = null, target = null;
    for (const r of [r0, r0 + 1, r0 - 1, r0 + 2, r0 - 2]) {
      if (r <= 0 || r > 0xff) continue;
      const prod = f32(f32(f32(r) / f32(10)) * f32(doseI));
      if (Math.trunc(prod) === Math.trunc(prod + 0.5)) { chosen = r; target = Math.trunc(prod); break; }
    }
    if (target === null) {
      chosen = Math.max(1, Math.min(0xff, r0));
      target = Math.trunc(f32(f32(f32(chosen) / f32(10)) * f32(doseI)));
    }
    const ideal = srcVols.map(v => v * target / total);
    const iv = ideal.map(x => Math.floor(x));
    const deficit = target - iv.reduce((a, b) => a + b, 0);
    if (deficit > 0) {
      const order = ideal.map((_, i) => i).sort((a, b) => (ideal[b] - iv[b]) - (ideal[a] - iv[a]));
      for (const i of order.slice(0, deficit)) iv[i] += 1;
    }
    return { vols: iv, ratio: chosen & 0xff };
  };

  const PATTERN_API_TO_BYTE = { 1: 0, 2: 2, 3: 1 }; // centered, spiral, circular

  XB.encodeBlob = (pours, { grinderSize = 0, doseG = 0, rpm = 0 } = {}) => {
    const doseI = doseG ? XB.pyRound(+doseG) : 0;
    const src = pours.map(p => Math.max(0, +(p.volume_ml || 0)));
    const { vols, ratio } = XB.gateVolumes(src, doseI);
    const parts = [];
    pours.forEach((p, i) => {
      const volume = i < vols.length ? vols[i] : 0;
      const temp = Math.trunc(p.temperature_c ?? 93);
      const pattern = PATTERN_API_TO_BYTE[Math.trunc(p.pattern ?? 1)] ?? 0;
      const vib = ((p.agitate_before ?? 2) == 1 ? 1 : 0) | ((p.agitate_after ?? 2) == 1 ? 2 : 0);
      const flow = XB.pyRound((p.flow_rate ?? 3.0) * 10) & 0xff;
      const post = Math.trunc(p.pause_s ?? 0);
      if (volume > 127) {
        for (let k = 0; k < Math.floor(volume / 127); k++) parts.push(127, temp, pattern, vib);
        const rem = volume % 127;
        if (rem) parts.push(rem, temp, pattern, vib);
      } else parts.push(volume, temp, pattern, vib);
      parts.push((-post) & 0xff, 0, i === 0 ? (Math.trunc(rpm) & 0xff) : 0, flow);
    });
    const grinderByte = Math.min(Math.trunc(grinderSize), 80) & 0xff;
    return { blob: Uint8Array.from([parts.length & 0xff, ...parts, grinderByte, ratio & 0xff]), vols, ratio };
  };

  // Ordered frames: handshake, bypass+dose, set-cup, recipe, execute.
  XB.buildBrewFrames = recipe => {
    const doseI = XB.pyRound(+recipe.dose_g || 0);
    const grinder = Math.trunc(+recipe.grinder_size || 0);
    const useGrinder = grinder > 0;
    const rpm = Math.trunc(+recipe.rpm || 0);
    const cup = Math.trunc(+recipe.cup_type || 3);
    const [mx, mn] = XB.CUP_RANGE[cup] || [200, 80];
    const enc = XB.encodeBlob(recipe.pours || [], {
      grinderSize: useGrinder ? grinder : 0, doseG: doseI, rpm: useGrinder ? rpm : 0,
    });
    return {
      frames: [
        ['handshake', XB.frame(XB.CMD.HANDSHAKE, { ints: [185, 1] })],
        ['bypass+dose', XB.frame(XB.CMD.BYPASS_DOSE, { ints: [0, 0, doseI] })],
        ['set_cup', XB.frame(XB.CMD.SET_CUP, { ints: [XB.f32bits(mx), XB.f32bits(mn)] })],
        ['recipe', XB.frame(useGrinder ? XB.CMD.RECIPE_GRIND : XB.CMD.RECIPE_NO_GRIND, { raw: enc.blob })],
        ['execute', XB.frame(XB.CMD.EXECUTE)],
      ],
      wireVolumes: enc.vols, ratioByte: enc.ratio,
    };
  };

  // Her recipe: a bloom, then even spiral pours of at most ~110 ml.
  XB.makeRecipe = ({ dose = 15, ratio = 25, temp = 92, grind = 55, rpm = 90, cup = 2 } = {}) => {
    const total = Math.round(dose * ratio);
    const bloom = Math.max(30, Math.round(dose * 3));
    const rest = total - bloom;
    const n = Math.min(8, Math.max(2, Math.ceil(rest / 110)));
    const pours = [{ volume_ml: bloom, temperature_c: temp, pattern: 3, flow_rate: 3.0, pause_s: 30, agitate_before: 2, agitate_after: 2 }];
    const base = Math.floor(rest / n);
    let extra = rest - base * n;
    for (let i = 0; i < n; i++) {
      const v = base + (extra-- > 0 ? 1 : 0);
      pours.push({ volume_ml: v, temperature_c: temp, pattern: 2, flow_rate: 3.0, pause_s: i === n - 1 ? 0 : 15, agitate_before: 2, agitate_after: 2 });
    }
    return { dose_g: dose, grinder_size: grind, rpm, cup_type: cup, pours, total };
  };

  // Stream reassembly of FFE2 notifications into whole 58 02 frames.
  XB.makeParser = onFrame => {
    let buf = new Uint8Array(0);
    return chunk => {
      const n = new Uint8Array(buf.length + chunk.length);
      n.set(buf); n.set(chunk, buf.length); buf = n;
      while (buf.length >= 9) {
        let i = -1;
        for (let k = 0; k + 1 < buf.length; k++) if (buf[k] === 0x58 && buf[k + 1] === 0x02) { i = k; break; }
        if (i < 0) { buf = buf.slice(buf.length - 1); break; }
        if (i > 0) buf = buf.slice(i);
        if (buf.length < 9) break;
        const len = buf[5] | (buf[6] << 8) | (buf[7] << 16) | (buf[8] << 24);
        if (len < 12 || len > 1024) { buf = buf.slice(1); continue; }
        if (buf.length < len) break;
        const f = buf.slice(0, len);
        if (XB.crc16(f.slice(0, len - 2)) === (f[len - 2] | (f[len - 1] << 8))) {
          buf = buf.slice(len);
          onFrame(XB.parseFrame(f));
        } else buf = buf.slice(1); // resync on the next 58 02
      }
    };
  };

  XB.parseFrame = f => {
    const code = f[3] | (f[4] << 8);
    const p = f.slice(10, f.length - 2);
    const dv = new DataView(p.buffer, p.byteOffset, p.byteLength);
    const out = { code, payload: p, raw: f };
    if ((code === XB.NOTIFY.WEIGHT || code === XB.NOTIFY.WEIGHT_ALT) && p.length >= 4) out.weight = dv.getFloat32(0, true);
    else if (code === XB.NOTIFY.WATER && p.length >= 4) out.water = dv.getFloat32(0, true);
    else if (code === XB.NOTIFY.ACTIVITY && p.length >= 4) out.activity = dv.getUint32(0, true);
    else if (code === XB.NOTIFY.BLOOM && p.length >= 4) out.pourIndex = dv.getUint32(0, true);
    else if (code === XB.NOTIFY.MACHINE_INFO && p.length >= 43) {
      out.info = { water: p[33], sys: p[34], grind: Math.max(p[37] - 30, 1), ui: p[42],
        mode: p.length >= 55 && p[51] === 0x91 && p[52] === 0x32 && p[53] === 0x78 && p[54] === 0x56 ? 'auto' : 'pro' };
    }
    if (p.length >= 16) out.replyCode = (p[12] << 16) | (p[13] << 8) | p[14];
    return out;
  };

  XB.hex = a => Array.from(a).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');

  if (typeof module !== 'undefined' && module.exports) module.exports = XB;
  else root.XB = XB;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const DEFAULTS = { dose: 15, ratio: 25, temp: 92, grind: 55, cup: 2 };
  const LIMITS = { temp: [85, 96], grind: [30, 80] };
  const CHUNK = 20;   // Android Chrome writes at most 20 bytes per packet; the machine reassembles.

  // ---------- settings ----------
  let S = { ...DEFAULTS };
  try { S = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('xb.recipe') || '{}') }; } catch (e) {}
  const save = () => { try { localStorage.setItem('xb.recipe', JSON.stringify(S)); } catch (e) {} };
  const doseRange = () => XB.CUP_DOSE[S.cup] || [5, 18];

  function render() {
    const [dmin, dmax] = doseRange();
    S.dose = Math.min(dmax, Math.max(dmin, S.dose));
    const rec = XB.makeRecipe({ dose: S.dose, ratio: S.ratio, temp: S.temp, grind: S.grind, cup: S.cup });
    const built = XB.buildBrewFrames(rec);
    const total = built.wireVolumes.reduce((a, b) => a + b, 0);
    $('oDose').textContent = S.dose + ' g';
    $('oRatio').textContent = '1 : ' + S.ratio;
    $('rRatio').value = S.ratio;
    $('oTotal').textContent = total;
    $('oTemp').textContent = S.temp + ' °C';
    $('oGrind').textContent = S.grind;
    const v = built.wireVolumes;
    $('oPlan').textContent = `悶蒸 ${v[0]} ml，等 30 秒 → 再分 ${v.length - 1} 次注水（${v.slice(1).join('、')} ml）`;
    $('cBeans').textContent = `豆子（${S.dose} 克）已倒進上方豆倉`;
    $('cPot').textContent = `下面放了裝得下 ${Math.ceil((total + 30) / 50) * 50} ml 的壺`;
    document.querySelectorAll('#segCup button').forEach(b => b.classList.toggle('on', +b.dataset.cup === S.cup));
    save();
    updateBrewButton();
  }

  document.querySelectorAll('.stepper button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, d = +b.dataset.d;
    if (k === 'dose') { const [lo, hi] = doseRange(); S.dose = Math.min(hi, Math.max(lo, S.dose + d)); }
    else { const [lo, hi] = LIMITS[k]; S[k] = Math.min(hi, Math.max(lo, S[k] + d)); }
    render();
  }));
  $('rRatio').addEventListener('input', e => { S.ratio = +e.target.value; render(); });
  document.querySelectorAll('#segCup button').forEach(b => b.addEventListener('click', () => { S.cup = +b.dataset.cup; render(); }));
  $('btnReset').addEventListener('click', () => { S = { ...DEFAULTS }; render(); });
  document.querySelectorAll('.chk').forEach(c => c.addEventListener('change', updateBrewButton));

  // ---------- log / messages ----------
  const LOG = [];
  const log = m => { LOG.push(new Date().toLocaleTimeString() + ' ' + m); if (LOG.length > 300) LOG.shift(); $('log').textContent = LOG.slice(-120).join('\n'); };
  function msg(kind, html) { const el = $('msg'); if (!kind) { el.className = 'alert hidden'; return; } el.className = 'alert ' + kind; el.innerHTML = html; el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  function pill(id, text, kind) { const el = $(id); el.textContent = text; el.className = 'pill' + (kind ? ' ' + kind : ''); }

  // ---------- Bluetooth ----------
  const B = { dev: null, ffe1: null, waiters: {}, q: Promise.resolve(), info: null, brewing: false };

  const parser = XB.makeParser(fr => {
    const w = B.waiters[fr.code];
    if (w) { delete B.waiters[fr.code]; w(fr); }
    onNotify(fr);
  });

  function writeFrame(bytes) {
    B.q = B.q.then(async () => {
      if (!B.ffe1) throw new Error('not connected');
      for (let i = 0; i < bytes.length; i += CHUNK) {
        await B.ffe1.writeValueWithoutResponse(bytes.slice(i, i + CHUNK));
        if (i + CHUNK < bytes.length) await sleep(15);
      }
    });
    return B.q.catch(e => { B.q = Promise.resolve(); throw e; });
  }

  class Refused extends Error { constructor(step, reason, code) { super(step + ':' + reason); this.step = step; this.reason = reason; this.rc = code; } }
  class Unanswered extends Error { constructor(step) { super(step + ':no_reply'); this.step = step; } }

  function awaitReply(code, ms) {
    return new Promise(res => {
      const to = setTimeout(() => { delete B.waiters[code]; res(null); }, ms);
      B.waiters[code] = fr => { clearTimeout(to); res(fr); };
    });
  }

  // Send one command and wait for the machine to echo its code (the official app's ACK gating).
  async function sendStep(name, frame, { timeout = 3000, attempts = 2 } = {}) {
    const code = frame[3] | (frame[4] << 8);
    for (let a = 1; a <= attempts; a++) {
      const p = awaitReply(code, timeout);
      await writeFrame(frame);
      log(`→ ${name}（第 ${a} 次）`);
      const fr = await p;
      if (!fr) continue;
      const rc = fr.replyCode || 0;
      if (rc && !(a > 1 && XB.takenOnResend(rc))) { log(`← ${name} 拒絕 0x${rc.toString(16)} ${XB.refusalFor(rc)}`); throw new Refused(name, XB.refusalFor(rc) || 'unknown', rc); }
      log(`← ${name} 接受`);
      await sleep(100);
      return fr;
    }
    throw new Unanswered(name);
  }

  async function connect() {
    msg(null);
    if (!navigator.bluetooth) {
      msg('bad', '這個瀏覽器不能用藍牙。請用 <b>Android 手機的 Chrome</b> 打開這個網址（iPhone 不支援）。');
      return;
    }
    try {
      $('btnConnect').disabled = true; $('btnConnect').textContent = '請在跳出的視窗選 XBLOOM…';
      let dev = B.dev;
      if (!dev) dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'XBLOOM' }], optionalServices: [XB.SVC] });
      B.dev = dev;
      dev.removeEventListener('gattserverdisconnected', onDisconnected);
      dev.addEventListener('gattserverdisconnected', onDisconnected);
      $('btnConnect').textContent = '連線中…';
      let svc = null, lastErr = null;
      for (let k = 0; k < 4 && !svc; k++) {
        try { const g = await dev.gatt.connect(); await sleep(600); svc = await g.getPrimaryService(XB.SVC); }
        catch (e) { lastErr = e; await sleep(1200); }
      }
      if (!svc) throw lastErr || new Error('connect failed');
      B.ffe1 = await svc.getCharacteristic(XB.FFE1);
      const n = await svc.getCharacteristic(XB.FFE2);
      n.addEventListener('characteristicvaluechanged', e => parser(new Uint8Array(e.target.value.buffer.slice(0))));
      await n.startNotifications();
      pill('pConn', '已連線 ' + dev.name, 'ok');
      $('btnConnect').classList.add('hidden');
      log('已連線 ' + dev.name);
      try { await sendStep('handshake', XB.frame(XB.CMD.HANDSHAKE, { ints: [185, 1] }), { timeout: 1500, attempts: 3 }); }
      catch (e) { log('握手沒有回應：' + e.message); }
      updateBrewButton();
    } catch (e) {
      log('連線失敗：' + e.message);
      $('btnConnect').classList.remove('hidden');
      if (e.name !== 'NotFoundError') msg('bad', '連不上咖啡機。請確認：手機藍牙已開、人在咖啡機旁邊、<b>官方 xBloom App 已關閉</b>（機器一次只能連一支手機），再按一次「連線咖啡機」。');
    } finally {
      $('btnConnect').disabled = false; $('btnConnect').textContent = B.dev ? '重新連線' : '連線咖啡機';
    }
  }

  function onDisconnected() {
    B.ffe1 = null;
    pill('pConn', '已斷線', 'bad');
    $('btnConnect').classList.remove('hidden');
    $('btnConnect').textContent = '重新連線';
    log('藍牙斷線');
    if (B.brewing) msg('warn', '藍牙斷線了。<b>咖啡機會自己沖完</b>，請留在旁邊；要停止的話先按上面的「重新連線」。');
    updateBrewButton();
  }

  // ---------- notifications ----------
  const BREW = { t0: 0, total: 0, water: 0, phase: '', timer: null, paused: false };
  function setPhase(p, sub) { BREW.phase = p; $('oPhase').textContent = p; if (sub !== undefined) $('oSub').textContent = sub; }

  function onNotify(fr) {
    const c = fr.code;
    if (fr.weight !== undefined) { if (B.brewing) $('nWeight').textContent = fr.weight.toFixed(1); return; }
    if (fr.water !== undefined) {
      if (B.brewing && fr.water > 0) {
        BREW.water = Math.max(BREW.water, fr.water);
        $('nWater').textContent = Math.round(BREW.water);
        $('oBar').style.width = Math.min(100, BREW.water / BREW.total * 100) + '%';
        if (BREW.phase === '研磨中') setPhase('注水中', '熱水注入中，請不要移動濾杯和壺');
      }
      return;
    }
    if (fr.info) {
      B.info = fr.info;
      pill('pWater', fr.info.water ? '水量 OK' : '水箱沒水', fr.info.water ? 'ok' : 'bad');
      $('pWater').classList.remove('hidden');
      const locked = fr.info.sys === 18;
      pill('pState', locked ? '可能需要先校正' : '待命中', locked ? 'warn' : 'ok');
      $('pState').classList.remove('hidden');
      log(`機器資訊：水 ${fr.info.water ? 'OK' : '不足'}，狀態 ${fr.info.sys}，畫面 ${fr.info.ui}`);
      return;
    }
    log('← ' + c + (fr.activity !== undefined ? ' activity ' + fr.activity : '') + (fr.pourIndex !== undefined ? ' pour ' + fr.pourIndex : ''));
    if (XB.FAULTS[c]) { msg('bad', '咖啡機回報：<b>' + XB.FAULTS[c] + '</b>'); if (B.brewing) setPhase('暫停：' + XB.FAULTS[c], '處理好之後按「繼續」，或按「停止」'); return; }
    if (!B.brewing) return;
    if (c === XB.NOTIFY.GRINDER_STOPPED && BREW.phase === '研磨中') setPhase('注水中', '研磨完成，開始注水');
    else if (c === XB.NOTIFY.BLOOM) { const i = fr.pourIndex || 0; setPhase(i === 0 ? '悶蒸中' : `第 ${i} 次注水`, '請不要移動濾杯和壺'); }
    else if (c === XB.NOTIFY.ENJOY || c === XB.NOTIFY.ENJOY_PRE) finish('完成，請享用 ☕', 'ok');
    else if (c === XB.NOTIFY.ABANDONED) finish('已中止', 'warn');
    else if ([XB.NOTIFY.PAUSED, XB.NOTIFY.GRINDER_PAUSED, XB.NOTIFY.BREWER_PAUSED].includes(c)) showPaused(true);
    else if ([XB.NOTIFY.RESUMED, XB.NOTIFY.MACHINE_RESUMED].includes(c)) showPaused(false);
  }

  // ---------- brewing ----------
  function updateBrewButton() {
    const allChecked = [...document.querySelectorAll('.chk')].every(c => c.checked);
    $('btnBrew').disabled = !(B.ffe1 && allChecked) || B.brewing;
    $('btnBrew').textContent = !B.ffe1 ? '請先連線咖啡機' : allChecked ? '開始沖煮' : '請先勾選上面三項';
  }

  const REASON_TEXT = {
    not_ready: '咖啡機還沒準備好（斷電後的保護鎖定）。<br>請用<b>官方 xBloom App</b>：點機器圖片 → 設定 → 進階功能 →「重設磨豆刀盤」（約 2 分鐘，<b>豆倉要先清空</b>），完成後回來再按開始。',
    restore_incomplete: '咖啡機還沒準備好（斷電後的保護鎖定）。請先用官方 xBloom App 做一次「重設磨豆刀盤」（豆倉先清空）。',
    no_water: '水箱沒水了，請加水並把水箱壓到底，再按開始。',
    machine_busy: '咖啡機正在忙，請等一下再按開始。',
    recipe_rejected: '咖啡機不接受這個配方，請按「恢復預設」再試一次。',
    not_on_home_screen: '咖啡機還在別的畫面，請等幾秒再按一次開始。',
  };

  async function goHome() {
    for (const code of [XB.CMD.QUIT_RECIPE, 8014, 8013, 8012]) {
      try { await writeFrame(XB.frame(code)); } catch (e) {}
      await sleep(400);
    }
  }

  async function sendRecipe(built, { execute }) {
    const f = Object.fromEntries(built.frames);
    await sendStep('handshake', f.handshake, { timeout: 1500, attempts: 3 });
    for (const name of ['bypass+dose', 'set_cup', 'recipe']) await sendStep(name, f[name], { timeout: 3000, attempts: 2 });
    if (execute) await sendStep('execute', f.execute, { timeout: 3000, attempts: 2 });
  }

  async function brew() {
    msg(null);
    const rec = XB.makeRecipe({ dose: S.dose, ratio: S.ratio, temp: S.temp, grind: S.grind, cup: S.cup });
    const built = XB.buildBrewFrames(rec);
    log(`配方：${S.dose} g，1:${S.ratio}，${built.wireVolumes.join('/')} ml，${S.temp}°C，研磨 ${S.grind}，杯型 ${S.cup}`);
    B.brewing = true; updateBrewButton();
    $('btnBrew').textContent = '傳送配方中…';
    let sentRecipe = false;
    try {
      try { await sendRecipe(built, { execute: false }); }
      catch (e) {
        if (e instanceof Refused && e.reason === 'not_on_home_screen') { log('不在待機畫面，先回主畫面再試'); await goHome(); await sendRecipe(built, { execute: false }); }
        else throw e;
      }
      sentRecipe = true;
      await sendStep('execute', Object.fromEntries(built.frames).execute, { timeout: 3000, attempts: 2 });
      startBrewUI(built.wireVolumes.reduce((a, b) => a + b, 0));
    } catch (e) {
      B.brewing = false;
      if (sentRecipe) { try { await writeFrame(XB.frame(XB.CMD.QUIT_RECIPE)); } catch (_) {} }
      if (e instanceof Refused) msg(e.reason === 'no_water' ? 'warn' : 'bad', REASON_TEXT[e.reason] || ('咖啡機拒絕了（代碼 0x' + (e.rc || 0).toString(16) + '）。'));
      else if (e instanceof Unanswered) msg('bad', '咖啡機沒有回應。請靠近一點，按「重新連線」後再試。');
      else msg('bad', '傳送失敗：' + e.message + '。請按「重新連線」後再試。');
      log('沖煮沒有開始：' + e.message);
      updateBrewButton();
    }
  }

  async function wakeLock() { try { B.lock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  function releaseLock() { try { B.lock && B.lock.release(); } catch (e) {} B.lock = null; }

  function startBrewUI(total) {
    Object.assign(BREW, { t0: Date.now(), total, water: 0, paused: false });
    $('recipeCard').classList.add('hidden'); $('checkCard').classList.add('hidden');
    $('brewCard').classList.remove('hidden');
    $('btnStop').classList.remove('hidden'); $('btnPause').classList.remove('hidden'); $('btnResume').classList.add('hidden');
    $('btnAgain').classList.add('hidden');
    $('nWater').textContent = '0'; $('nWeight').textContent = '–'; $('oBar').style.width = '0%';
    setPhase('研磨中', `目標 ${total} ml，請留在咖啡機旁邊`);
    clearInterval(BREW.timer);
    BREW.timer = setInterval(() => { const s = Math.floor((Date.now() - BREW.t0) / 1000); $('nTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 500);
    wakeLock();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function finish(text, kind) {
    if (!B.brewing) return;
    B.brewing = false;
    clearInterval(BREW.timer);
    setPhase(text, kind === 'ok' ? `共 ${Math.round(BREW.water) || BREW.total} ml` : '');
    if (kind === 'ok') $('oBar').style.width = '100%';
    $('btnStop').classList.add('hidden'); $('btnPause').classList.add('hidden'); $('btnResume').classList.add('hidden');
    $('btnAgain').classList.remove('hidden');
    document.querySelectorAll('.chk').forEach(c => c.checked = false);
    releaseLock();
    updateBrewButton();
  }

  function showPaused(p) {
    BREW.paused = p;
    $('btnPause').classList.toggle('hidden', p); $('btnResume').classList.toggle('hidden', !p);
    if (p) setPhase('已暫停', '按「繼續」接著沖，或按「停止」結束');
  }

  async function control(code, name) {
    try { await sendStep(name, XB.frame(code), { timeout: 2000, attempts: 2 }); return true; }
    catch (e) {
      if (e instanceof Unanswered) { log(name + ' 沒有回覆（可能已執行）'); return true; }
      msg('bad', name + '失敗：' + (REASON_TEXT[e.reason] || e.message)); return false;
    }
  }

  $('btnStop').addEventListener('click', async () => {
    $('btnStop').disabled = true; $('btnStop').textContent = '停止中…';
    const ok = await control(XB.CMD.BREW_STOP, '停止');
    $('btnStop').disabled = false; $('btnStop').textContent = '停止';
    if (ok) finish('已停止', 'warn');
  });
  $('btnPause').addEventListener('click', async () => { if (await control(XB.CMD.BREW_PAUSE, '暫停')) showPaused(true); });
  $('btnResume').addEventListener('click', async () => { if (await control(XB.CMD.BREW_RESUME, '繼續')) { showPaused(false); setPhase('注水中', '繼續沖煮'); } });
  $('btnAgain').addEventListener('click', () => {
    $('brewCard').classList.add('hidden'); $('recipeCard').classList.remove('hidden'); $('checkCard').classList.remove('hidden'); msg(null);
  });
  $('btnConnect').addEventListener('click', connect);
  $('btnBrew').addEventListener('click', brew);

  // Dry run: send the recipe without starting, then drop it. Nothing grinds or pours.
  $('btnDry').addEventListener('click', async () => {
    if (!B.ffe1) { msg('warn', '請先連線咖啡機。'); return; }
    const built = XB.buildBrewFrames(XB.makeRecipe({ dose: S.dose, ratio: S.ratio, temp: S.temp, grind: S.grind, cup: S.cup }));
    try {
      await sendRecipe(built, { execute: false });
      msg('ok', '配方送出成功，機器已接受（沒有開始沖煮，已取消）。');
    } catch (e) {
      msg(e instanceof Refused ? 'warn' : 'bad', '檢查結果：' + (e instanceof Refused ? (REASON_TEXT[e.reason] || e.message) : '沒有回應'));
    } finally {
      try { await writeFrame(XB.frame(XB.CMD.QUIT_RECIPE)); } catch (_) {}
    }
  });

  window.__xbTest = { parser, B, startBrewUI, finish, onNotify };
  window.addEventListener('beforeunload', e => { if (B.brewing) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && B.brewing) wakeLock(); });

  if (!navigator.bluetooth) msg('warn', '這個瀏覽器不能用藍牙。請用 <b>Android 手機的 Chrome</b> 打開這個網址。');
  render();
})();
</script>
</body>
</html>
